[package]
name = "ops-agent"
version = "0.1.0"
edition = "2021"
description = "面向 Linux 运维人员的 AI Agent(TUI), 接入 DeepSeek, 可管理本机与 Kubernetes 集群"
license = "MIT"

[dependencies]
ratatui = "0.30.2"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "net",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
dirs = "6"
chrono = "0.4"
textwrap = "0.16"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
