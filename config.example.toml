# OpsAgent 旧版配置示例（TOML）
#
# 0.2 起配置保存在 SQLite：~/.local/share/ops-agent/ops-agent.db 的 settings 表，
# 在 TUI 里按 F2 修改即可（回车自动保存）。
#
# 这个文件只在以下场景有用：数据库还是空的、且本文件存在于
# ~/.config/ops-agent/config.toml 时，首次启动会自动导入一次。

api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# OpenAI 兼容的接口地址
base_url = "https://api.deepseek.com"

# deepseek-chat（支持工具调用，推荐）
model = "deepseek-chat"

temperature = 0.3
max_tokens = 4096
max_tool_rounds = 16

# 危险：true 时所有工具调用都不再弹窗确认，仅建议测试环境使用
auto_approve_all = false

kubectl_context = ""
kubectl_namespace = ""

shell_timeout_secs = 60
